<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Backoffice - Boomviagens</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/backoffice/css/shell.css" />
  <link rel="stylesheet" href="/backoffice/css/dashboard.css" />
  <link rel="stylesheet" href="/backoffice/css/pipeline.css" />
  <link rel="stylesheet" href="/backoffice/css/reservations.css" />
  <link rel="stylesheet" href="/backoffice/css/customers.css" />
  <link rel="stylesheet" href="/backoffice/css/system.css" />
</head>
<body>
  <div id="loginGate" class="login-gate">
    <form id="loginForm" class="login-card">
      <p class="login-eyebrow">boomviagens.pt</p>
      <h1>Backoffice</h1>
      <p class="muted">Acesso reservado à equipa Boomviagens.</p>
      <label>Utilizador <input name="username" autocomplete="username" required /></label>
      <label>Password <input name="password" type="password" autocomplete="current-password" required /></label>
      <button class="btn wide" type="submit">Entrar</button>
      <p id="loginMessage" class="login-message"></p>
    </form>
  </div>

  <div id="appShell" class="app-shell" hidden>
    <aside class="sidebar">
      <div class="sidebar-brand">
        <span class="sidebar-brand-mark">Boom<em>viagens</em></span>
        <span class="sidebar-brand-tag">Backoffice</span>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-area" data-area="comercial">
          <p class="nav-section-title">Comercial</p>
          <button type="button" class="nav-item" data-view="pipeline"><span class="nav-item-icon">◇</span>Pipeline</button>
          <button type="button" class="nav-item" data-view="propostas"><span class="nav-item-icon">▤</span>Propostas</button>
          <button type="button" class="nav-item" data-view="followups"><span class="nav-item-icon">↗</span>Follow-ups</button>
          <button type="button" class="nav-item" data-view="clientes"><span class="nav-item-icon">◎</span>Clientes</button>
        </div>

        <div class="nav-area" data-area="operacao" hidden>
          <p class="nav-section-title">Operação</p>
          <button type="button" class="nav-item" data-view="resumo"><span class="nav-item-icon">⌂</span>Resumo operacional</button>
          <button type="button" class="nav-item" data-view="reservas"><span class="nav-item-icon">✈</span>Processos / Reservas</button>
          <button type="button" class="nav-item" data-view="pipeline-operacional"><span class="nav-item-icon">◫</span>Pipeline Operacional</button>
          <button type="button" class="nav-item" data-view="clientes"><span class="nav-item-icon">◎</span>Clientes</button>
        </div>

        <div class="nav-area" data-area="online" hidden>
          <p class="nav-section-title">Online</p>
          <button type="button" class="nav-item" data-view="online"><span class="nav-item-icon">◉</span>Resumo Online</button>
          <button type="button" class="nav-item" data-view="reservas"><span class="nav-item-icon">✓</span>Vendas / Processos</button>
          <button type="button" class="nav-item" data-view="pipeline"><span class="nav-item-icon">◇</span>Oportunidades</button>
        </div>

        <div class="nav-area" data-area="equipa" hidden>
          <p class="nav-section-title">Equipa</p>
          <button type="button" class="nav-item" data-view="meu-dia"><span class="nav-item-icon">☀</span>O Meu Dia</button>
          <button type="button" class="nav-item" data-view="visao-geral"><span class="nav-item-icon">▥</span>Visão Geral</button>
          <button type="button" class="nav-item" data-view="equipa"><span class="nav-item-icon">◎</span>Equipa</button>
          <button type="button" class="nav-item" data-view="tarefas-equipa"><span class="nav-item-icon">✓</span>Tarefas</button>
          <button type="button" class="nav-item" data-view="agenda"><span class="nav-item-icon">▦</span>Agenda</button>
        </div>

        <div class="nav-area" data-area="financeiro" hidden>
          <p class="nav-section-title">Financeiro</p>
          <button type="button" class="nav-item is-disabled" disabled><span class="nav-item-icon">€</span>Recebimentos / Pagamentos<span class="soon-badge">em breve</span></button>
          <button type="button" class="nav-item" data-view="fornecedores"><span class="nav-item-icon">▦</span>Fornecedores</button>
          <button type="button" class="nav-item" data-view="margens"><span class="nav-item-icon">△</span>Margens</button>
        </div>

        <div class="nav-area" data-area="gestao" hidden>
          <p class="nav-section-title">Gestão e Sistema</p>
          <button type="button" class="nav-item" data-view="agencias"><span class="nav-item-icon">▥</span>Agências</button>
          <button type="button" class="nav-item" data-view="emails"><span class="nav-item-icon">✉</span>Emails</button>
          <button type="button" class="nav-item" data-view="operador"><span class="nav-item-icon">⌁</span>Operadores / APIs</button>
        </div>
      </nav>

      <div class="sidebar-footer">
        <a class="sidebar-footer-link" href="/">← Voltar ao site</a>
        <button type="button" id="logoutBtn" class="sidebar-footer-link sidebar-footer-btn">Terminar sessão</button>
      </div>
    </aside>

    <div class="main">
      <div class="workspace-switcher" role="tablist" aria-label="Área de trabalho">
        <button type="button" class="workspace-tab is-active" data-area="comercial">Comercial</button>
        <button type="button" class="workspace-tab" data-area="operacao">Operação</button>
        <button type="button" class="workspace-tab" data-area="online">Online <span class="workspace-alert-dot" id="onlineSalesDot" hidden></span></button>
        <button type="button" class="workspace-tab" data-area="equipa">Equipa</button>
        <button type="button" class="workspace-tab" data-area="financeiro">Financeiro</button>
        <button type="button" class="workspace-tab" data-area="gestao">Gestão</button>
      </div>
      <header class="topbar">
        <h1 id="pageTitle">Resumo Geral</h1>
        <span id="companyBadge" class="badge"></span>
      </header>

      <main class="content">
        <section id="view-resumo" class="view"></section>
        <section id="view-online" class="view" hidden></section>
        <section id="view-pipeline" class="view" hidden></section>
        <section id="view-propostas" class="view" hidden></section>
        <section id="view-followups" class="view" hidden></section>
        <section id="view-reservas" class="view" hidden></section>
        <section id="view-pipeline-operacional" class="view" hidden></section>
        <section id="view-clientes" class="view" hidden></section>
        <section id="view-meu-dia" class="view" hidden></section>
        <section id="view-visao-geral" class="view" hidden></section>
        <section id="view-equipa" class="view" hidden></section>
        <section id="view-tarefas-equipa" class="view" hidden></section>
        <section id="view-agenda" class="view" hidden></section>
        <section id="view-fornecedores" class="view" hidden></section>
        <section id="view-margens" class="view" hidden></section>
        <section id="view-agencias" class="view" hidden></section>
        <section id="view-emails" class="view" hidden></section>
        <section id="view-operador" class="view" hidden></section>
      </main>
    </div>

    <!-- Navegacao movel (<=900px): tab bar fixa com as areas principais e
         "Mais" a abrir a folha com todos os workspaces/menus - mesmo
         padrao da area de cliente (public/conta). Os grupos da folha sao
         gerados em main.js a partir da propria sidebar. -->
    <nav class="mobile-tabbar" aria-label="Navegação principal">
      <button type="button" class="tab-item is-active" data-area="comercial">
        <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="4.5" height="16" rx="1"/><rect x="10" y="4" width="4.5" height="10" rx="1"/><rect x="16" y="4" width="4.5" height="6" rx="1"/></svg>
        Comercial
      </button>
      <button type="button" class="tab-item" data-area="operacao">
        <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="16" rx="2"/><path d="M9 12l2 2 4-4"/></svg>
        Operação
      </button>
      <button type="button" class="tab-item" data-area="online">
        <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M4 12h16M12 4c3 3 3 13 0 16-3-3-3-13 0-16z"/></svg>
        Online
        <span class="workspace-alert-dot" hidden></span>
      </button>
      <button type="button" class="tab-item" data-area="equipa">
        <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3.5 19c1-3 3-4.5 5.5-4.5S13.5 16 14.5 19"/><circle cx="16.5" cy="9" r="2.4"/><path d="M16 14.6c2.2.2 3.8 1.6 4.5 4"/></svg>
        Equipa
      </button>
      <button type="button" class="tab-item" id="moreMenuBtn" aria-controls="boSheet" aria-expanded="false">
        <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
        Mais
      </button>
    </nav>

    <div class="bo-sheet" id="boSheet" hidden>
      <button type="button" class="bo-sheet-backdrop" id="boSheetBackdrop" aria-label="Fechar menu"></button>
      <div class="bo-sheet-panel" role="dialog" aria-label="Áreas de trabalho e mais opções">
        <div class="bo-sheet-handle" aria-hidden="true"></div>
        <div id="boSheetGroups"></div>
        <div class="bo-sheet-group">
          <h3>Geral</h3>
          <a class="sheet-link" href="/">← Voltar ao site</a>
          <button type="button" id="sheetLogoutBtn" class="sheet-link is-danger">Terminar sessão</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/backoffice/js/main.js"></script>
</body>
</html>
