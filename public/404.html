<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Página não encontrada - Boomviagens</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/base.css" />
  <style>
    .not-found {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 14px;
      padding: 24px;
    }
    .not-found img { width: 56px; height: 56px; }
    .not-found h1 { font-family: var(--font-display); font-size: clamp(28px, 5vw, 40px); margin: 0; }
    .not-found p { color: var(--muted); margin: 0 0 10px; max-width: 40ch; }
  </style>
</head>
<body>
  <main class="not-found">
    <img src="/favicon.svg" alt="" />
    <h1>Página não encontrada</h1>
    <p>O link pode estar desatualizado ou a página foi movida. Volte à página inicial para continuar a explorar viagens.</p>
    <a class="btn" href="/">Voltar ao início</a>
  </main>
</body>
</html>
